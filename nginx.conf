# ====================================================================
# MAXORA BANGLADESH (maxorabd.com) - NGINX HIGH-PERFORMANCE CONFIGURATION
# Features: Gzip, Brotli, 1-Year Browser Caching, Reverse Proxy to Node.js
# ====================================================================

upstream nodejs_backend {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name maxorabd.com www.maxorabd.com;

    # Redirect all HTTP traffic to HTTPS (for production)
    # return 301 https://$host$request_uri;

    root /var/www/maxorabd.com/dist;
    index index.html;

    # 1. GZIP COMPRESSION CONFIGURATION
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml
        font/woff2;

    # 2. BROTLI COMPRESSION (if ngx_brotli module is installed)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # 3. 1-YEAR IMMUTABLE CACHE FOR STATIC ASSETS & WEBP IMAGES
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|svg|woff2?|ttf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri @backend;
    }

    # 4. UPLOADS DIRECTORY CACHING
    location /uploads/ {
        alias /var/www/maxorabd.com/public/uploads/;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        access_log off;
        try_files $uri @backend;
    }

    # 5. API ROUTES PROXY TO NODE.JS BACKEND
    location /api/ {
        proxy_pass http://nodejs_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Buffer optimizations for high throughput
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
    }

    # 6. SPA CLIENT ROUTING
    location / {
        try_files $uri $uri/ /index.html @backend;
        # HTML documents revalidate to immediately pick up newly deployed asset hashes
        add_header Cache-Control "public, max-age=0, must-revalidate";
    }

    location @backend {
        proxy_pass http://nodejs_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
